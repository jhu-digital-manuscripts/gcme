<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>Glossarial Concordance to Middle English</title>
    <meta name="description" content="The Works of Geoffrey Chaucer and the English Works of John Gower">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    {{content-for "head"}}

    <link rel="icon" href="{{rootURL}}favicon.ico" type="image/png">
    <link integrity="" rel="stylesheet" href="{{rootURL}}assets/vendor.css">
    <link integrity="" rel="stylesheet" href="{{rootURL}}assets/gcme-ember.css">

    {{content-for "head-footer"}}
  </head>
  <body>
    {{content-for "body"}}

    <script>
      // GitHub Pages SPA redirect restoration.
      // If we arrived here via the 404.html redirect, restore the original URL
      // in the address bar before Ember boots. This makes the router see the
      // correct path and the URL stays clean for the user.
      (function() {
        var redirectPath = sessionStorage.getItem('spa-redirect-path');
        if (redirectPath) {
          sessionStorage.removeItem('spa-redirect-path');
          // Only restore if we're at the app root (the redirect destination).
          // This prevents issues if someone manually navigates to index.html.
          if (window.location.pathname === '{{rootURL}}' || 
              window.location.pathname === '{{rootURL}}index.html') {
            window.history.replaceState(null, '', redirectPath);
          }
        }
      })();
    </script>

    <script src="{{rootURL}}assets/vendor.js"></script>
    <script src="{{rootURL}}assets/gcme-ember.js"></script>

    {{content-for "body-footer"}}
    <div id="ember-bootstrap-wormhole"></div>
  </body>
</html>
