name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ember:
    name: gcme-ember (Node 20)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gcme-ember
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'
          cache-dependency-path: gcme-ember/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build (production)
        run: npm run build

  java:
    name: gcme-tool (Java 25 / Maven)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gcme-tool
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 25 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Maven verify
        env:
          GCME_DATA: ../data
        run: mvn -B verify
