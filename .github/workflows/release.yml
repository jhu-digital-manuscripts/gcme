name: release

on:
  workflow_dispatch:
    inputs:
      release_version:
        description: 'Release version (e.g., 1.0.0)'
        required: true
        type: string
      next_version:
        description: 'Next development version (e.g., 1.0.1-SNAPSHOT)'
        required: true
        type: string

jobs:
  release:
    name: Release gcme-tool and gcme-ember
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Set up JDK 25 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'
          cache-dependency-path: gcme-ember/package-lock.json

      - name: Set release version in pom.xml
        working-directory: gcme-tool
        run: mvn -B versions:set -DnewVersion=${{ inputs.release_version }} -DgenerateBackupPoms=false

      - name: Set release version in package.json
        working-directory: gcme-ember
        run: npm version ${{ inputs.release_version }} --no-git-tag-version --allow-same-version

      - name: Build gcme-tool
        working-directory: gcme-tool
        env:
          GCME_DATA: ../data
        run: mvn -B clean verify

      - name: Generate data
        working-directory: deploy
        run: ./gen_data.sh

      - name: Install gcme-ember dependencies
        working-directory: gcme-ember
        run: npm ci

      - name: Lint gcme-ember
        working-directory: gcme-ember
        run: npm run lint

      - name: Test gcme-ember
        working-directory: gcme-ember
        run: npm test

      - name: Build gcme-ember (production)
        working-directory: gcme-ember
        run: npm run build

      - name: Commit release version
        run: |
          git add gcme-tool/pom.xml gcme-ember/package.json gcme-ember/package-lock.json
          git commit -m "Release version ${{ inputs.release_version }}"

      - name: Create release tag
        run: |
          git tag -a "v${{ inputs.release_version }}" -m "Release ${{ inputs.release_version }}"

      - name: Set next development version in pom.xml
        working-directory: gcme-tool
        run: mvn -B versions:set -DnewVersion=${{ inputs.next_version }} -DgenerateBackupPoms=false

      - name: Set next development version in package.json
        working-directory: gcme-ember
        run: npm version ${{ inputs.next_version }} --no-git-tag-version --allow-same-version

      - name: Commit next development version
        run: |
          git add gcme-tool/pom.xml gcme-ember/package.json gcme-ember/package-lock.json
          git commit -m "Prepare next development version ${{ inputs.next_version }}"

      - name: Push changes and tag
        run: |
          git push origin main
          git push origin "v${{ inputs.release_version }}"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${{ inputs.release_version }}" \
            --title "Release ${{ inputs.release_version }}" \
            --generate-notes \
            gcme-tool/target/gcme-tool.jar

      - name: Deploy to gh-pages
        run: |
          set -euo pipefail

          # Stage the built site. .nojekyll tells GitHub Pages to publish the
          # files as-is instead of running Jekyll over them.
          rm -rf /tmp/gcme-site
          cp -r gcme-ember/dist /tmp/gcme-site
          touch /tmp/gcme-site/.nojekyll

          # Use a separate worktree so untracked build output (node_modules,
          # target, dist) in the main checkout can never be committed here.
          rm -rf /tmp/gh-pages
          git worktree prune
          if git fetch origin gh-pages:refs/remotes/origin/gh-pages; then
            git worktree add -B gh-pages /tmp/gh-pages origin/gh-pages
          else
            git worktree add --detach /tmp/gh-pages HEAD
            git -C /tmp/gh-pages checkout --orphan gh-pages
          fi

          # GitHub writes CNAME into the publishing branch for a custom domain,
          # so keep it across deploys.
          if [ -f /tmp/gh-pages/CNAME ]; then
            cp /tmp/gh-pages/CNAME /tmp/gcme-site/CNAME
          fi

          # Replace the entire published tree with the new site
          find /tmp/gh-pages -mindepth 1 -maxdepth 1 -not -name .git -exec rm -rf {} +
          cp -r /tmp/gcme-site/. /tmp/gh-pages/

          git -C /tmp/gh-pages add -A
          git -C /tmp/gh-pages commit -m "Deploy release ${{ inputs.release_version }}" \
            || echo "No changes to commit"
          git -C /tmp/gh-pages push origin gh-pages
          git worktree remove --force /tmp/gh-pages
